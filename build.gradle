plugins {
	id 'org.relativitymc.neo-loom-remap' version '1.18-SNAPSHOT'
	id 'maven-publish'
	id 'me.modmuss50.mod-publish-plugin' version "2.2.1"
}

java {
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

base {
	archivesName = project.archives_base_name
}

version = project.mod_version
group = project.maven_group

repositories {
	mavenCentral()

	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.

	maven { url = "https://maven.shedaniel.me/" }
	maven { url = "https://maven.neoforged.net/releases/" }
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.layered {
		it.mappings("net.fabricmc:yarn:$project.yarn_mappings:v2")
		it.mappings("dev.architectury:yarn-mappings-patch-neoforge:$project.yarn_mappings_patch_neoforge_version")
	}
	forgeUserdev "net.neoforged:neoforge:${project.forge_version}:userdev"

    modCompileOnly "me.shedaniel.cloth:cloth-config-neoforge:21.11.153"

	testImplementation 'org.junit.jupiter:junit-jupiter:5.13.4'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
	useJUnitPlatform()
	environment "ALSOFT_LOGLEVEL", "3"
	workingDir project.buildDir
	testLogging {
		showStandardStreams = true
		exceptionFormat = 'full'
	}
}

loom {
	accessWidenerPath = file("src/main/resources/rsls.accesswidener")
	mixin {
		useLegacyMixinAp = true
	}
}

remapJar {
	useMixinAP = true
	atAccessWideners.add("rsls.accesswidener")
}

processResources {
	inputs.property "version", project.version

	filesMatching("META-INF/neoforge.mods.toml") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	// Minecraft 1.18 (1.18-pre2) upwards uses Java 17.
	it.options.release = 21
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.archives_base_name}"}
	}
	manifest {
		attributes([
				"MixinConfigs": "rsls.mixins.json"
		])
	}
}

afterEvaluate {
	migrateMappings.configure {
		outputDir = project.file("src/main/java")
	}
}

// configure the maven publication
publishing {
	publications {
		mavenJava(MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}

def ghaChangelog = System.getenv("OVERRIDE_CHANGELOG")
if (ghaChangelog == null) {
	ghaChangelog = "No changelog provided"
} else {
	ghaChangelog = ghaChangelog.replace("\\n", "\n")
}

publishMods {
	changelog = ghaChangelog
	modLoaders.add("neoforge")

	def envDisplayName = System.getenv("OVERRIDE_DISPLAY_NAME")
	displayName = envDisplayName != null ? envDisplayName : (project.version + " devbuild for fabric " + project.minecraft_version)

	def envType = System.getenv("OVERRIDE_RELEASE_TYPE")
	type = envType != null ? me.modmuss50.mpp.ReleaseType.valueOf(envType) : me.modmuss50.mpp.ReleaseType.ALPHA

	it.version = project.version

	dryRun = providers.environmentVariable("PUBLISH_DRY_RUN").getOrNull() == "YES_DRYRUN"

	def cfOptions = curseforgeOptions {
		accessToken = System.getenv("CURSEFORGE_TOKEN")
		minecraftVersionRange {
			start = "1.21.1"
			end = "1.21.11"
		}
		client = true
		changelogType = "markdown"
		javaVersions.add(JavaVersion.VERSION_25)
		javaVersions.add(JavaVersion.VERSION_22)
		javaVersions.add(JavaVersion.VERSION_21)
	}

	curseforge("curseforgePackage") {
		from cfOptions
		file = remapJar.archiveFile
		projectId = "646146"
	}

	def mrOptions = modrinthOptions {
		accessToken = System.getenv("MODRINTH_TOKEN")
		minecraftVersionRange {
			start = "1.21.1"
			end = "1.21.11"
		}
	}

	modrinth("modrinthPackage") {
		from mrOptions
		file = remapJar.archiveFile
		projectId = "SKW62Pht"
	}
}
